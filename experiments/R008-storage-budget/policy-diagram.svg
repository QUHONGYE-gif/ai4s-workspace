<?xml version="1.0" encoding="UTF-8"?>
<svg id="policyDiagram" viewBox="0 0 1100 500" width="1100" height="500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
          </marker>
          <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
          </marker>
        </defs>

        <rect x="40" y="22" width="172" height="46" rx="9" fill="#FFFFFF" stroke="#E4E7EC"/>
        <text x="126" y="50" font-size="13" fill="#1A1D23" text-anchor="middle">一次请求（指纹）</text>

        <rect x="40" y="98" width="172" height="58" rx="9" fill="#FFF8EC" stroke="#F6D9A8"/>
        <text x="126" y="122" font-size="12.5" fill="#92400E" text-anchor="middle">命中的产物仍 active？</text>
        <text x="126" y="140" font-size="11" fill="#B45309" text-anchor="middle">且文件真实存在</text>

        <rect x="252" y="98" width="132" height="58" rx="9" fill="#F0FDF4" stroke="#BBE7C9"/>
        <text x="318" y="122" font-size="12.5" fill="#15803D" text-anchor="middle">直接读取产物</text>
        <text x="318" y="140" font-size="11" fill="#15803D" text-anchor="middle">更新使用时间与次数</text>

        <rect x="424" y="106" width="60" height="42" rx="21" fill="#FFFFFF" stroke="#BBE7C9"/>
        <text x="454" y="132" font-size="12" fill="#15803D" text-anchor="middle">命中</text>

        <rect x="40" y="192" width="172" height="46" rx="9" fill="#FFFFFF" stroke="#E4E7EC"/>
        <text x="126" y="220" font-size="12.5" fill="#1A1D23" text-anchor="middle">计算（或按原输入重算）</text>

        <rect x="40" y="260" width="172" height="46" rx="9" fill="#FFFFFF" stroke="#E4E7EC"/>
        <text x="126" y="288" font-size="12.5" fill="#1A1D23" text-anchor="middle">写出产物文件 · 落库</text>

        <rect x="40" y="332" width="172" height="58" rx="9" fill="#FFF8EC" stroke="#F6D9A8"/>
        <text x="126" y="356" font-size="12.5" fill="#92400E" text-anchor="middle">占用 &gt; 配额？</text>
        <text x="126" y="374" font-size="11" fill="#B45309" text-anchor="middle">真实磁盘占用，每轮重算</text>

        <rect x="392" y="318" width="208" height="86" rx="9" fill="#EFF4FF" stroke="#BFD2FF"/>
        <text x="496" y="339" font-size="12.5" fill="#1E40AF" text-anchor="middle" font-weight="600">候选集（两策略共用）</text>
        <text x="405" y="358" font-size="11.2" fill="#2563EB">status = active · pinned = 0</text>
        <text x="405" y="374" font-size="11.2" fill="#2563EB">本轮刚写入的排除在外</text>
        <text x="405" y="390" font-size="11" fill="#60A5FA">两策略看到的候选完全相同</text>

        <rect x="648" y="252" width="240" height="62" rx="9" fill="#FFFFFF" stroke="#E4E7EC"/>
        <text x="768" y="274" font-size="12.3" fill="#1A1D23" text-anchor="middle" font-weight="600">LRU 排序键</text>
        <text x="768" y="293" font-size="11.2" fill="#4A5568" text-anchor="middle">last_used_at 升序 → 取第一个</text>

        <rect x="648" y="352" width="240" height="86" rx="9" fill="#F6F2FF" stroke="#DCCEFB"/>
        <text x="768" y="373" font-size="12.3" fill="#5B21B6" text-anchor="middle" font-weight="600">打分排序键</text>
        <text x="768" y="392" font-size="10.8" fill="#6D28D9" text-anchor="middle">value 升序 · 0.25 分档后再按时间</text>
        <text x="768" y="410" font-size="10.8" fill="#6D28D9" text-anchor="middle">log(1+f)·log(1+c)/size^0.7·e^(−age/168h)</text>
        <text x="768" y="428" font-size="10.5" fill="#8B5CF6" text-anchor="middle">理由带四个分量，可逐项复核</text>

        <rect x="930" y="300" width="150" height="104" rx="9" fill="#FEF2F2" stroke="#F5C9C9"/>
        <text x="1005" y="323" font-size="12.3" fill="#991B1B" text-anchor="middle" font-weight="600">取价值最低的一个</text>
        <text x="1005" y="343" font-size="11" fill="#B91C1C" text-anchor="middle">写墓碑记录（原因）</text>
        <text x="1005" y="361" font-size="11" fill="#B91C1C" text-anchor="middle">删文件（仅实验目录）</text>
        <text x="1005" y="381" font-size="10.6" fill="#DC2626" text-anchor="middle">降到配额 85% 以下</text>
        <text x="1005" y="396" font-size="10.6" fill="#DC2626" text-anchor="middle">再回到「占用 &gt; 配额」</text>

        <line x1="126" y1="68" x2="126" y2="96" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="212" y1="127" x2="250" y2="127" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <text x="229" y="120" font-size="10.5" fill="#15803D" text-anchor="middle">是</text>
        <line x1="384" y1="127" x2="422" y2="127" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="126" y1="156" x2="126" y2="190" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <text x="132" y="177" font-size="10.5" fill="#B45309">否 / 已淘汰</text>
        <line x1="126" y1="238" x2="126" y2="258" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="126" y1="306" x2="126" y2="330" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="212" y1="352" x2="244" y2="352" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <text x="250" y="356" font-size="10.5" fill="#4A5568">否 · 结束</text>
        <path d="M 126 390 L 126 462 L 496 462 L 496 406" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arb)"/>
        <text x="304" y="448" font-size="10.5" fill="#2563EB" text-anchor="middle">是：需要腾空间</text>
        <line x1="600" y1="345" x2="646" y2="292" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="600" y1="378" x2="646" y2="390" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="888" y1="290" x2="928" y2="330" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="888" y1="392" x2="928" y2="372" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
        <text x="620" y="488" font-size="10.5" fill="#8A94A6" text-anchor="middle">仍超配额：重复「候选集 → 排序 → 删一个」，直到占用降到 85% 以下</text>
      </svg>
