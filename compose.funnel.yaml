# Apply after compose.yaml and compose.server.yaml once the Funnel URL is known.
# Does not expose additional host ports or start Tailscale itself.
services:
  coder:
    environment:
      CODER_ACCESS_URL: ${AI4S_PUBLIC_URL:?Set the verified https://...ts.net URL}
      CODER_SECURE_AUTH_COOKIE: "true"
      CODER_DERP_FORCE_WEBSOCKETS: "true"
