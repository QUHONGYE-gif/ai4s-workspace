# Dedicated virtual host; leaves the existing my-rustdesk.xyz website intact.
map $http_upgrade $ai4s_connection_upgrade {
    default upgrade;
    '' close;
}
log_format ai4s_coder '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name coder.my-rustdesk.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ai4s-coder/acme;
    }
    location / {
        return 301 https://coder.my-rustdesk.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coder.my-rustdesk.xyz;
    ssl_certificate /etc/letsencrypt/live/coder.my-rustdesk.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coder.my-rustdesk.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ai4s-coder-access.log ai4s_coder;
    error_log /var/log/nginx/ai4s-coder-error.log;
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:27080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai4s_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
